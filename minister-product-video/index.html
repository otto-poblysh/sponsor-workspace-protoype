    <style>

        @font-face { font-family: 'Geist Sans'; src: url('capture/assets/fonts/Geist-Variable.woff2'); }
        @font-face { font-family: 'Geist Mono'; src: url('capture/assets/fonts/GeistMono-Variable.woff2'); }

      body {
        margin: 0;
        background: radial-gradient(circle at center, #2C2C2E 0%, #111111 100%);
        color: #111111;
        font-family: 'Geist Sans', -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* The Browser Window Frame */
      .browser-window {
        width: 1728px;
        height: 1024px;
        background: #F9F9F8;
        border-radius: 12px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 10;
      }

      /* macOS-style Header */
      .browser-header {
        height: 52px;
        background: #F4F4F3;
        border-bottom: 1px solid #E5E5E5;
        display: flex;
        align-items: center;
        padding: 0 20px;
        position: relative;
      }

      /* Traffic Lights */
      .traffic-lights {
        display: flex;
        gap: 8px;
      }
      .traffic-light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .tl-red { background: #FF5F56; }
      .tl-yellow { background: #FFBD2E; }
      .tl-green { background: #27C93F; }

      /* URL Bar */
      .url-bar {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        background: #FFFFFF;
        border: 1px solid #E5E5E5;
        border-radius: 6px;
        padding: 6px 16px;
        font-family: 'Geist Sans', sans-serif;
        font-size: 14px;
        color: #787774;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 400px;
        justify-content: center;
      }
      .url-lock {
        width: 10px;
        height: 12px;
        border: 1.5px solid #A5A29A;
        border-radius: 3px 3px 0 0;
        position: relative;
      }
      .url-lock::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: -2.5px;
        width: 12px;
        height: 8px;
        background: #A5A29A;
        border-radius: 2px;
      }

      /* The Viewport Container for the Clips */
      .browser-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: #F9F9F8;
      }

      /* The scaled container that holds 1920x1080 clips */
      .scale-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        transform: scale(0.9);
        transform-origin: top left;
      }

      .clip {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
