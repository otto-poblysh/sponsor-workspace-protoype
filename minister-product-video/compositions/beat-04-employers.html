      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Employer screen enters from y:80
        tl.fromTo("#bg-screen",
          { y: 80, opacity: 0 },
          { y: 0, opacity: 0.2, duration: 1.0, ease: "power3.out" },
          0.2
        );

        // Headline reveals from horizontal crop
        tl.fromTo("#headline",
          { x: -100, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
          0.4
        );

        // Three employer rows separate
        tl.fromTo(".employer-row",
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.8, stagger: 0.11, ease: "power2.out" },
          0.8
        );

        // Bioko status advances to Verified (row 1)
        tl.to("#badge1", { x: 140, duration: 0.8, ease: "power2.inOut" }, 1.8);
        tl.to("#badge1", { x: 260, duration: 0.8, ease: "power2.inOut" }, 2.8);
        tl.add(() => {
          const b = document.getElementById("badge1");
          b.innerText = "VERIFIED";
          b.className = "status-badge badge-verified";
        }, 3.6);
        // Glow semantic green
        tl.fromTo("#badge1", 
          { boxShadow: "0 0 0px #346538" },
          { boxShadow: "0 0 20px #346538", duration: 0.3, yoyo: true, repeat: 1 },
          3.6
        );

        // Annobón status settles at Pending Review (row 3)
        tl.to("#badge3", { x: 120, duration: 0.8, ease: "power2.inOut" }, 2.0);
        tl.add(() => {
          const b = document.getElementById("badge3");
          b.innerText = "PENDING REVIEW";
          b.className = "status-badge badge-review";
        }, 2.8);

        // Litoral onboarding bar fills to 85% (row 2)
        let obProxy = { val: 30 };
        tl.to(obProxy, {
          val: 85,
          duration: 1.2,
          ease: "power2.out",
          onUpdate: () => {
            document.getElementById("ob-val2").innerText = Math.round(obProxy.val) + "%";
          }
        }, 3.0);
        tl.to("#ob-fill2", { width: "85%", duration: 1.2, ease: "power2.out" }, 3.0);

        // Benefit line draws onto navy footer band at 6.2s
        tl.fromTo("#footer",
          { y: "100%" },
          { y: "0%", duration: 0.8, ease: "power2.out" },
          6.0
        );
        tl.fromTo("#benefit",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power1.out" },
          6.4
        );

        window.__timelines["beat-04"] = tl;
      </script>
