      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Log container reveals from top with a mask at 0.2s
        tl.fromTo("#log-container",
          { clipPath: "inset(0 0 100% 0)" },
          { clipPath: "inset(0 0 0% 0)", duration: 1.0, ease: "power3.inOut" },
          0.2
        );
        tl.fromTo("#headline",
          { y: -30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
          0.4
        );

        // Log rows stream in rapidly
        tl.fromTo(".log-row",
          { opacity: 0, x: 20 },
          { opacity: 1, x: 0, duration: 0.3, stagger: 0.04, ease: "power1.out" },
          0.8
        );

        // Scrollbar thumb moves down, simulating a system scan at 2.0s
        // Content moves up simultaneously
        tl.to("#thumb", { y: 120, duration: 1.5, ease: "power2.inOut" }, 2.0);
        tl.to("#log-content", { y: -140, duration: 1.5, ease: "power2.inOut" }, 2.0);

        // The row highlights in warm bone at 3.5s
        tl.add(() => {
          document.getElementById("target-row").classList.add("highlighted-row");
        }, 3.5);
        tl.fromTo("#target-row",
          { scale: 1 },
          { scale: 1.02, duration: 0.4, ease: "power2.out" },
          3.5
        );

        // Accountability statement anchors the composition at 5.0s
        tl.fromTo("#benefit",
          { y: 30, opacity: 0 },
          { y: 0, opacity: 1, duration: 1.0, ease: "power2.out" },
          5.0
        );

        window.__timelines["beat-09"] = tl;
