            </div>
          </div>
          <div data-hf-id="hf-p48g" class="funnel-stage">

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Headline lands from slight scale
        tl.fromTo("#headline",
          { scale: 0.95, opacity: 0 },
          { scale: 1, opacity: 1, duration: 1.0, ease: "power2.out" },
          0.2
        );

        // Vacancy cards slide from the right
        tl.fromTo(".vacancy-card",
          { x: 100, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.8, stagger: 0.15, ease: "power2.out" },
          0.6
        );

        // Funnel outline draws (flow line)
        tl.to("#flow-path", { strokeDashoffset: 0, duration: 1.0, ease: "power1.inOut" }, 1.2);
        
        tl.fromTo(".stage-bar-container", 
          { opacity: 0 }, 
          { opacity: 1, duration: 0.4, stagger: 0.1 }, 
          1.2
        );

        // Applicant counts to 6408, subsequent stages fill
        const targets = [6408, 1628, 982, 814];
        const widths = [100, 25, 15, 12];
        const els = ["#stage-val1", "#stage-val2", "#stage-val3", "#stage-val4"];
        const fills = ["#stage-fill1", "#stage-fill2", "#stage-fill3", "#stage-fill4"];
        
        targets.forEach((target, i) => {
          let proxy = { val: 0 };
          tl.to(proxy, {
            val: target,
            duration: 2.0,
            ease: "power2.out",
            onUpdate: () => {
              document.querySelector(els[i]).innerText = Math.round(proxy.val).toLocaleString();
            }
          }, 1.5 + (i * 0.2));
          
          tl.to(fills[i], {
            width: widths[i] + "%",
            duration: 2.0,
            ease: "power2.out"
          }, 1.5 + (i * 0.2));
        });
        
        // Hired stage settles in green at 4.8s (already done via CSS, just a slight glow)
        tl.fromTo("#stage-fill4",
          { filter: "brightness(1.5)" },
          { filter: "brightness(1)", duration: 0.6 },
          4.2
        );

        // Hard-to-fill vacancy receives its red outline and 2 APPLICANTS callout
        tl.fromTo("#vac1-outline",
          { borderColor: "transparent" },
          { borderColor: "#9F2F2D", duration: 0.4 },
          5.0
        );
        tl.fromTo("#vac1-callout",
          { x: 20, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.6, ease: "back.out(1.5)" },
          5.2
        );

        // Constraint statement anchors beneath the vacancy cards at 7.0s
        tl.fromTo("#constraint",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
          7.0
        );

        window.__timelines["beat-05"] = tl;
      </script>
